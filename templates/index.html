<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Dog Classifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .file-input-label:active {
            transform: translateY(0);
        }

        .file-name {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        .image-preview {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result-section {
            margin-top: 30px;
            display: none;
            text-align: center;
        }

        .result-section.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prediction-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .prediction-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prediction-text {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 1.3em;
            opacity: 0.95;
        }

        .probabilities {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            color: #333;
        }

        .prob-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .prob-item:last-child {
            margin-bottom: 0;
        }

        .prob-label {
            font-weight: 600;
            font-size: 1.1em;
        }

        .prob-bar-container {
            flex: 1;
            margin: 0 15px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .prob-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.6s ease-out;
            border-radius: 10px;
        }

        .prob-value {
            font-weight: 700;
            min-width: 50px;
            text-align: right;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error.show {
            display: block;
        }

        .emoji {
            font-size: 1.2em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 vs 🐶</h1>
        <p class="subtitle">Cat or Dog Classifier</p>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" accept="image/*">
                <label for="imageInput" class="file-input-label">
                    📤 Choose an Image
                </label>
            </div>
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="image-preview" id="imagePreview">
            <img id="previewImage" src="" alt="Preview">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Analyzing image...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result-section" id="resultSection">
            <div class="prediction-box">
                <div class="prediction-label">Prediction</div>
                <div class="prediction-text" id="predictionText"></div>
                <div class="confidence">
                    Confidence: <span id="confidenceValue"></span>%
                </div>
            </div>

            <div class="probabilities">
                <div class="prob-item">
                    <span class="prob-label">🐱 Cat</span>
                    <div class="prob-bar-container">
                        <div class="prob-bar" id="catBar"></div>
                    </div>
                    <span class="prob-value" id="catProb"></span>
                </div>
                <div class="prob-item">
                    <span class="prob-label">🐶 Dog</span>
                    <div class="prob-bar-container">
                        <div class="prob-bar" id="dogBar"></div>
                    </div>
                    <span class="prob-value" id="dogProb"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const fileName = document.getElementById('fileName');
        const imagePreview = document.getElementById('imagePreview');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultSection = document.getElementById('resultSection');
        const predictionText = document.getElementById('predictionText');
        const confidenceValue = document.getElementById('confidenceValue');
        const catBar = document.getElementById('catBar');
        const catProb = document.getElementById('catProb');
        const dogBar = document.getElementById('dogBar');
        const dogProb = document.getElementById('dogProb');

        imageInput.addEventListener('change', handleImageUpload);

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Reset previous results
            error.classList.remove('show');
            resultSection.classList.remove('show');
            loading.classList.remove('show');

            // Display file name
            fileName.textContent = `Selected: ${file.name}`;

            // Display image preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Send to API
            sendToPredictionAPI(file);
        }

        function sendToPredictionAPI(file) {
            loading.classList.add('show');

            const formData = new FormData();
            formData.append('image', file);

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Prediction failed');
                    });
                }
                return response.json();
            })
            .then(data => {
                loading.classList.remove('show');
                displayResults(data);
            })
            .catch(err => {
                loading.classList.remove('show');
                showError(err.message);
            });
        }

        function displayResults(data) {
            const { prediction, confidence, probabilities } = data;

            // Update prediction
            const emoji = prediction === 'Cat' ? '🐱' : '🐶';
            predictionText.textContent = `${prediction} ${emoji}`;
            confidenceValue.textContent = confidence;

            // Update probability bars with animation
            setTimeout(() => {
                catBar.style.width = probabilities.cat + '%';
                catProb.textContent = probabilities.cat + '%';
                dogBar.style.width = probabilities.dog + '%';
                dogProb.textContent = probabilities.dog + '%';
            }, 100);

            resultSection.classList.add('show');
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('show');
        }
    </script>
</body>
</html>
